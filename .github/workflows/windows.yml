name: Windows build and conversion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Core tests and real WPF UI conversion
        shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Create offline portable package
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Verify packaged EXE starts
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/PdfToTiff-win-x64/PdfToTiff.exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Packaged EXE exited early: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Packaged EXE did not create its window.' }
            $process.CloseMainWindow() | Out-Null
            if (-not $process.WaitForExit(10000)) { throw 'Packaged EXE did not close.' }
            if ($process.ExitCode -ne 0) { throw "Packaged EXE failed: $($process.ExitCode)" }
          }
          finally { if (-not $process.HasExited) { $process.Kill() } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-results
          path: |
            artifacts/PdfToTiff-win-x64.zip
            artifacts/PdfToTiff-win-x64.zip.sha256
            artifacts/ui-smoke.png
            artifacts/test-results/
          if-no-files-found: error
